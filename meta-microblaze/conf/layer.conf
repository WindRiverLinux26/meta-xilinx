# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BSP_XILINX_DERIVED ??= ""
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bb', '', d)}"
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bbappend', '', d)}"

BBFILE_COLLECTIONS += "xilinx-microblaze"
BBFILE_PATTERN_xilinx-microblaze = "^${LAYERDIR}/"
BBFILE_PRIORITY_xilinx-microblaze = "5"

LAYERSUMMARY_xilinx-microblaze = "AMD MicroBlaze architecture \
enablement"
LAYERDESCRIPTION_xilinx-microblaze = "Architecture enablement layer \
adding MicroBlaze and MicroBlaze-V (RISC-V) tunings, multilibs, and \
helpers used by AMD's standalone and embedded software flows."

BBFILES_DYNAMIC += " \
    xilinx:${LAYERDIR}/dynamic-layers/meta-xilinx-core/recipes-*/*/*.bb \
    xilinx:${LAYERDIR}/dynamic-layers/meta-xilinx-core/recipes-*/*/*.bbappend \
    "

LAYERDEPENDS_xilinx-microblaze = "core"

LAYERSERIES_COMPAT_xilinx-microblaze = "scarthgap whinlatter"

# Microblaze does not support stack-protector!
SECURITY_STACK_PROTECTOR:microblaze = ""

OLDEST_KERNEL:microblaze = "3.15"

INHERIT += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', 'rust_microblaze go_microblaze image_oci_microblaze', '', d)}"

MICROBLAZE_SKIP_MSG = ""
MICROBLAZE_SKIP_MSG:microblaze = "This recipe does not currently work on microblaze."

# ../../../alsa-lib-1.2.9/src/control/control.c:3648:1: error: symver is only supported on ELF platforms
SKIP_RECIPE[alsa-lib] = "${MICROBLAZE_SKIP_MSG}"

addpylib ${LAYERDIR}/lib mbv

# We can't use BSP_XILINX_DERIVED for BBFILES_DYNAMIC because BSP_XILINX_DERIVED
# has not been assigned when parsing BBFILES_DYNAMIC.
BBMASK += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '', '${LAYERDIR}/dynamic-layers/', d)}"
