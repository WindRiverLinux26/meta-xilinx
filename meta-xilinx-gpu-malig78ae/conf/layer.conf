# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BSP_XILINX_DERIVED ??= ""
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bb', '', d)}"
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bbappend', '', d)}"

BBFILE_COLLECTIONS += "xilinx-gpu-malig78ae"
BBFILE_PATTERN_xilinx-gpu-malig78ae = "^${LAYERDIR}/"
BBFILE_PRIORITY_xilinx-gpu-malig78ae = "5"

LAYERSUMMARY_xilinx-gpu-malig78ae = "AMD Versal Gen 2 Mali G78AE GPU \
support"
LAYERDESCRIPTION_xilinx-gpu-malig78ae = "GPU integration layer for the \
Mali G78AE block on AMD Versal Series Gen 2 SoCs (kernel driver, \
userspace libraries, and Wayland/X11 glue)."

# We use the mali400 layer to fill in some libmali-xlnx dependencies
LAYERDEPENDS_xilinx-gpu-malig78ae = " \
    core \
    xilinx \
    xilinx-mali400 \
    "

LAYERSERIES_COMPAT_xilinx-gpu-malig78ae = "scarthgap whinlatter"

INHERIT += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', 'sanity-meta-xilinx-gpu-malig78ae', '', d)}"

META_XILINX_MALIG78AE_CONFIG_PATH = "${LAYERDIR}/conf/distro/include/meta-xilinx-gpu-malig78ae-default-versions.inc"

USER_CLASSES:append = "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', ' meta-xilinx-gpu-malig78ae-cfg', '', d)}"
