# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BSP_XILINX_DERIVED ??= ""
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bb', '', d)}"
BBFILES += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '${LAYERDIR}/recipes-*/*/*.bbappend', '', d)}"

BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bbappend \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bb \
    qt5-layer:${LAYERDIR}/dynamic-layers/qt5-layer/recipes-*/*/*.bbappend \
    ros-common-layer:${LAYERDIR}/dynamic-layers/meta-ros/meta-ros-common/recipes-*/*/*.bb \
    ros-common-layer:${LAYERDIR}/dynamic-layers/meta-ros/meta-ros-common/recipes-*/*/*.bbappend \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/meta-ros/meta-ros2-jazzy/recipes-*/*/*.bb \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/meta-ros/meta-ros2-jazzy/recipes-*/*/*.bbappend \
    xilinx-multimedia:${LAYERDIR}/dynamic-layers/xilinx-multimedia/recipes-*/*/*.bb \
    xilinx-multimedia:${LAYERDIR}/dynamic-layers/xilinx-multimedia/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "xilinx-mali400"
BBFILE_PATTERN_xilinx-mali400 = "^${LAYERDIR}/"
BBFILE_PRIORITY_xilinx-mali400 = "5"

LAYERSUMMARY_xilinx-mali400 = "AMD Zynq UltraScale+ Mali-400 GPU \
support"
LAYERDESCRIPTION_xilinx-mali400 = "GPU integration layer for the \
Mali-400 block on AMD Zynq UltraScale+ MPSoC SoCs, including the \
libmali userspace driver and Wayland/X11 enablement."

LAYERDEPENDS_xilinx-mali400 = " \
    core \
    xilinx \
    "

LAYERSERIES_COMPAT_xilinx-mali400 = "scarthgap whinlatter"

INHERIT += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', 'sanity-meta-xilinx-mali400', '', d)}"

META_XILINX_MALI400_CONFIG_PATH = "${LAYERDIR}/conf/distro/include/meta-xilinx-mali400-default-versions.inc"

USER_CLASSES:append = "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', ' meta-xilinx-mali400-cfg', '', d)}"

# We can't use BSP_XILINX_DERIVED for BBFILES_DYNAMIC because BSP_XILINX_DERIVED
# has not been assigned when parsing BBFILES_DYNAMIC.
BBMASK += "${@bb.utils.contains_any('MACHINE', '${BSP_XILINX_DERIVED}', '', '${LAYERDIR}/dynamic-layers/', d)}"
